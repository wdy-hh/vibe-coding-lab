name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'projects/gesture-particle-system/**'
      - 'projects/ecom-content-studio/**'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/gesture-particle-system
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            projects/gesture-particle-system/package-lock.json
            projects/ecom-content-studio/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build application and local vision assets
        run: npm run build
      - name: Install E-Com Studio dependencies
        working-directory: projects/ecom-content-studio
        run: npm ci --no-audit --no-fund
      - name: Test E-Com Studio
        working-directory: projects/ecom-content-studio
        run: npm test
      - name: Build E-Com Studio
        working-directory: projects/ecom-content-studio
        run: npm run build
      - name: Package Pages site
        run: npm run pages:package
      - name: Add E-Com Studio to Pages site
        working-directory: .
        run: |
          mkdir -p build/pages/projects/ecom-content-studio
          cp -a projects/ecom-content-studio/dist/. build/pages/projects/ecom-content-studio/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

